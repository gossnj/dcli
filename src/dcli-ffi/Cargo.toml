[package]
name = "dcli-ffi"
version = "0.1.0"
edition = "2018"
authors = ["Mike Chambers <mikechambers@gmail.com>"]
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Use rustls-tls for Android cross-compilation (no OpenSSL needed)
dcli = { path = "../dcli", default-features = false, features = ["rustls-tls"] }
libc = "0.2"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread"] }
chrono = "0.4"
serde_json = "1.0"
zip = "0.5"

# Android JNI support
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
