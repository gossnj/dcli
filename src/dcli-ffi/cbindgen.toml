language = "C"
include_guard = "DCLI_FFI_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
pragma_once = true

[export]
include = [
    "DcliApiClient",
    "DcliCrucibleStats",
    "DcliCharacter",
]

[export.rename]

[defines]
"target_os = macos" = "TARGET_OS_MAC"
"target_os = ios" = "TARGET_OS_IOS"

[parse]
parse_deps = false
include = ["dcli-ffi"]

[layout]
packed = "C"
aligned_n = "C"
